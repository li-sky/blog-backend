version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - blog-network

  api:
    # image: ghcr.io/li-sky/blog-backend:latest
    build: .  # 开发时使用本地构建，生产时使用远程镜像
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://blog:blog@db:5432/blog?sslmode=disable
      JWT_SECRET: dev-secret-change-in-production
      STORAGE_BACKEND: filesystem
      STORAGE_FS_BASE_PATH: /uploads
      STORAGE_FS_BASE_URL: http://localhost/images
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/uploads
    networks:
      - blog-network
    restart: unless-stopped

  # 图片动态转换服务（可选，推荐生产环境使用）
  imgproxy:
    image: darthsim/imgproxy:latest
    environment:
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /uploads
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_TTL: 2592000  # 30天缓存
      IMGPROXY_MAX_SRC_RESOLUTION: 50  # 最大 50MP
    volumes:
      - uploads-data:/uploads:ro
    networks:
      - blog-network
    restart: unless-stopped

  # Nginx 代理（图片转换 + API 代理）
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - uploads-data:/uploads:ro
    depends_on:
      - api
      - imgproxy
    networks:
      - blog-network
    restart: unless-stopped

volumes:
  db-data:
  uploads-data:

networks:
  blog-network:
    driver: bridge
