worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # 图片缓存
    proxy_cache_path /var/cache/nginx/images 
                     levels=1:2 
                     keys_zone=images_cache:10m 
                     max_size=1g 
                     inactive=30d 
                     use_temp_path=off;

    upstream api_backend {
        server api:8080;
    }

    upstream imgproxy_backend {
        server imgproxy:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # 防止 Nginx 自动合并斜杠 (local:/// 需要保留三个斜杠)
        merge_slashes off;

        # API 代理
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 健康检查端点
        location /health {
            proxy_pass http://api_backend/health;
        }

        # 图片动态转换（通过 imgproxy）
        location /images/ {
            # 提取图片路径（移除 /images/ 前缀）
            set $image_path "";
            if ($uri ~ ^/images/(.+)$) {
                set $image_path $1;
            }
            
            if ($image_path = "") {
                return 404;
            }

            set $width $arg_w;
            set $format $arg_format;
            
            # 构造处理选项，默认 rs:fit:0:0 (不调整大小)
            # 注意：imgproxy 似乎需要至少一个处理选项才能正确解析 plain/local 源，或者避免解析歧义
            set $processing_options "rs:fit:0:0";
            
            if ($width != "") {
                set $processing_options "rs:fill:${width}:0:0";
            }
            
            # 构造 imgproxy URL
            # 格式: /processing_options/plain/local:///path/to/image
            set $imgproxy_url "${processing_options}/plain/local:///${image_path}";
            
            # 如果请求 webp 格式，添加后缀
            if ($format = "webp") {
                set $imgproxy_url "${imgproxy_url}@webp";
            }

            # 代理到 imgproxy
            proxy_pass http://imgproxy_backend/$imgproxy_url;
            
            # 缓存配置
            proxy_cache images_cache;
            proxy_cache_key "$uri$is_args$args";
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;

            # 头部设置
            proxy_set_header Host $host;
            proxy_pass_request_headers on;
            
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header Access-Control-Allow-Origin "*";
            
            # 忽略上游的缓存头
            proxy_ignore_headers Set-Cookie;
        }

        # 根路径（可选）
        location / {
            return 200 '{"message": "Blog Backend API", "docs": "/api/v1"}';
            add_header Content-Type application/json;
        }
    }
}
