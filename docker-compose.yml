services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - blog-network

  api:
    # image: ghcr.io/li-sky/blog-backend:latest
    build: .  # 开发时使用本地构建，生产时使用远程镜像
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://blog:blog@db:5432/blog?sslmode=disable
      JWT_SECRET: dev-secret-change-in-production
      STORAGE_BACKEND: filesystem
      STORAGE_FS_BASE_PATH: /uploads
      STORAGE_FS_BASE_URL: http://localhost/images
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/uploads
    networks:
      - blog-network
    restart: unless-stopped

  # Nginx 代理（静态图片 + API 代理）
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - uploads-data:/uploads:ro
    depends_on:
      - api
    networks:
      - blog-network
    restart: unless-stopped

volumes:
  db-data:
  uploads-data:

networks:
  blog-network:
    driver: bridge
