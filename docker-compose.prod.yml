version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-blog}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-blog}
    volumes:
      - /data/db:/var/lib/postgresql/data
    networks:
      - blog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-blog}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/li-sky/blog-backend:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-blog}:${DB_PASSWORD}@db:5432/${DB_NAME:-blog}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      GIN_MODE: release
      STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
      STORAGE_FS_BASE_PATH: ${STORAGE_FS_BASE_PATH:-/uploads}
      STORAGE_FS_BASE_URL: ${STORAGE_FS_BASE_URL}
    ports:
      - "8080:8080"
    volumes:
      - /data/uploads:/uploads
    networks:
      - blog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 图片动态转换服务（生产环境推荐）
  imgproxy:
    image: darthsim/imgproxy:latest
    ports:
      - "8081:8080"
    environment:
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /uploads
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_TTL: 2592000  # 30天缓存
      IMGPROXY_MAX_SRC_RESOLUTION: 50  # 最大 50MP
      IMGPROXY_JPEG_PROGRESSIVE: "true"
      IMGPROXY_PNG_INTERLACED: "true"
      IMGPROXY_QUALITY: 85
      IMGPROXY_GZIP_COMPRESSION: 5
    volumes:
      - /data/uploads:/uploads:ro
    networks:
      - blog-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    image: ghcr.io/li-sky/blog-backup:latest
    container_name: blog-backup
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SOURCE_UPLOADS_PATH: ${SOURCE_UPLOADS_PATH:-/data/uploads}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-blog}
      DB_USER: ${DB_USER:-blog}
      DB_PASSWORD: ${DB_PASSWORD}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      RESTIC_S3_ENDPOINT: ${RESTIC_S3_ENDPOINT}
      RESTIC_S3_BUCKET: ${RESTIC_S3_BUCKET}
      RESTIC_S3_REGION: ${RESTIC_S3_REGION:-us-east-1}
      RESTIC_S3_ACCESS_KEY: ${RESTIC_S3_ACCESS_KEY}
      RESTIC_S3_SECRET_KEY: ${RESTIC_S3_SECRET_KEY}
      RESTIC_S3_BUCKET_LOOKUP: ${RESTIC_S3_BUCKET_LOOKUP:-path}
      RESTIC_BASE_PREFIX: ${RESTIC_BASE_PREFIX:-blog-backup}
      UPLOADS_EXCLUDES: ${UPLOADS_EXCLUDES:-*.tmp *.swp */tmp/*}
      ENABLE_RETENTION_PRUNE: ${ENABLE_RETENTION_PRUNE:-true}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,db}
      V2RAY_ENABLED: ${V2RAY_ENABLED:-false}
      V2RAY_CONFIG_PATH: ${V2RAY_CONFIG_PATH:-/etc/v2ray/config.json}
      V2RAY_HTTP_PROXY: ${V2RAY_HTTP_PROXY:-http://127.0.0.1:10809}
      V2RAY_USE_V5: ${V2RAY_USE_V5:-false}
    volumes:
      - ${SOURCE_UPLOADS_PATH:-/data/uploads}:/source/uploads:ro
      - backup-state:/state
      - ${V2RAY_CONFIG_HOST_PATH:-./.v2rayconfig.json}:${V2RAY_CONFIG_PATH:-/etc/v2ray/config.json}:ro
    networks:
      - blog-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "/scripts/healthcheck.sh"]
      interval: 5m
      timeout: 15s
      retries: 2
      start_period: 45s

networks:
  blog-network:
    driver: bridge

volumes:
  backup-state: